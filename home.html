<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #d10068 0%, transparent 35%),
                radial-gradient(circle at bottom right, #6b003d 0%, transparent 35%),
                #10000a;
            color: white;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: auto;
            padding: 35px 0 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 45px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .header p {
            margin-top: 10px;
            color: #f3b8d5;
            font-size: 17px;
        }

        .expense-form {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
            gap: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        input,
        select {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #d9c4ce;
        }

        select option {
            color: black;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #ff4d9d;
            box-shadow: 0 0 10px rgba(255, 77, 157, 0.35);
        }

        #addExpense {
            padding: 16px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d10068, #ff4d9d);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        #addExpense:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(209, 0, 104, 0.4);
        }

        .table-box {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            padding: 18px 12px;
            color: #ff9fc7;
            font-size: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        td {
            padding: 16px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8e9f0;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .total-box {
            margin: 30px auto;
            width: fit-content;
            padding: 18px 35px;
            border-radius: 15px;
            background: linear-gradient(135deg, #d10068, #7b003d);
            box-shadow: 0 10px 30px rgba(209, 0, 104, 0.3);
        }

        .total-box h2 {
            margin: 0;
            font-size: 24px;
        }

        .monthly-section {
            margin-top: 45px;
        }

        .monthly-section h1 {
            text-align: center;
            font-style: italic;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .months {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .month-card {
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            transition: 0.3s;
        }

        .month-card:hover {
            transform: translateY(-5px);
            background: rgba(209, 0, 104, 0.2);
            box-shadow: 0 10px 25px rgba(209, 0, 104, 0.2);
        }

        .month-card p {
            margin: 0;
            font-size: 16px;
            color: #f5dce8;
        }

        .month-card span {
            color: #ff72ad;
            font-weight: bold;
        }

        @media (max-width: 1000px) {
            .expense-form {
                grid-template-columns: repeat(2, 1fr);
            }

            #addExpense {
                width: 100%;
            }

            .months {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 650px) {
            .container {
                width: 94%;
            }

            .header h1 {
                font-size: 34px;
            }

            .expense-form {
                grid-template-columns: 1fr;
            }

            .months {
                grid-template-columns: repeat(2, 1fr);
            }

            .monthly-section h1 {
                font-size: 27px;
            }
        }

        @media (max-width: 400px) {
            .months {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Expense Tracker</h1>
        <p>Track your spending and take control of your money</p>
    </div>

    <div class="expense-form">

        <input type="text" id="expense" placeholder="Expense name">

        <input type="text" id="amount" placeholder="Amount ₹">

        <select id="category">
            <option value="">Select Category</option>
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
        </select>

        <input type="date" id="date">

        <button id="addExpense">+ Add Expense</button>

    </div>

    <div class="table-box">

        <table class="code">

            <tr>
                <th>Expense Name</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>

        </table>

    </div>

    <div class="total-box">
        <h2>Total Expense: ₹<span id="total">0</span></h2>
    </div>

    <div class="monthly-section">

        <h1 class="code1">Monthly Expenses</h1>

        <div class="months">

            <div class="month-card">
                <p>January<br>₹<span id="january">0</span></p>
            </div>

            <div class="month-card">
                <p>February<br>₹<span id="february">0</span></p>
            </div>

            <div class="month-card">
                <p>March<br>₹<span id="march">0</span></p>
            </div>

            <div class="month-card">
                <p>April<br>₹<span id="april">0</span></p>
            </div>

            <div class="month-card">
                <p>May<br>₹<span id="may">0</span></p>
            </div>

            <div class="month-card">
                <p>June<br>₹<span id="june">0</span></p>
            </div>

            <div class="month-card">
                <p>July<br>₹<span id="july">0</span></p>
            </div>

            <div class="month-card">
                <p>August<br>₹<span id="august">0</span></p>
            </div>

            <div class="month-card">
                <p>September<br>₹<span id="september">0</span></p>
            </div>

            <div class="month-card">
                <p>October<br>₹<span id="october">0</span></p>
            </div>

            <div class="month-card">
                <p>November<br>₹<span id="november">0</span></p>
            </div>

            <div class="month-card">
                <p>December<br>₹<span id="december">0</span></p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
